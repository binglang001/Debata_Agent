# ============================================================================
# Diana 模型与提供商能力矩阵
# ============================================================================
# 生成日期: 2026-06-02
# 用途:
#   1. 向导/设置页模型选择下拉、能力校验、默认推荐
#   2. 运行时 context_length 推导、vision/embedding provider 自动匹配
#   3. 新用户默认模型选择
#
# 字段约定:
#   capabilities:
#     chat         - 基础文本对话
#     tool_call    - 函数调用 / 工具使用
#     reasoning    - 思考/推理（extended thinking / reasoning_effort / thinking budget）
#     vision       - 图像/多模态输入
#     embedding    - 向量嵌入（通常独立模型，不与 chat 模型共用）
#   context_length - 最大上下文窗口（tokens）
#   status:
#     recommended  - 新用户默认推荐（性价比 + 能力均衡）
#     active       - 可用，适合特定场景
#     deprecated   - 已停用或即将下线，仅兼容旧配置
#     legacy       - 官方下线，仅保留 ID 供历史配置迁移提示
#
# 视觉模型复用规则:
#   - 若主模型本身 supports_vision，向导默认"复用主模型"选项可用
#   - 若主模型不支持 vision，向导引导用户选择独立 vision provider
#
# RAG / Embedding 默认规则:
#   - Embedding 模型与 chat 模型是独立模型，不能默认复用主 chat provider
#   - 火山引擎 embedding 默认模型: doubao-embedding-vision-251215
#   - OpenAI embedding 推荐: text-embedding-3-small
#   - 其余 provider 若无 embedding 模型，RAG 默认选择独立 embedding provider
#
# 未确认能力标记:
#   - 若官方文档未明确某项能力，标记为 "unknown"，不猜测 true/false
# ============================================================================

providers:

  # =========================================================================
  # Anthropic Claude
  # =========================================================================
  anthropic:
    display_name: Anthropic Claude
    protocol: anthropic
    base_url: https://api.anthropic.com
