[project]
name = "diana"
version = "0.1.0"
description = "Diana QQ 机器人 —— 基于 NoneBot2 和 DeepSeek 的主动式 AI 机器人"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "openai-whisper>=20250625",
    "httpx>=0.24.0",
    "requests>=2.28.0",
    "duckduckgo-search>=8.0.0",
]

[tool.nonebot]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]
plugins = ["diana_agent"]
